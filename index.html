
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleWord</title>

    <!-- ✅ CSS FILE -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================================
     TEACHER PANEL
========================================= -->

<div id="teacher-panel">

    <h2>BubbleWord</h2>

    <p>Enter one vocabulary word and definition per line.</p>

    <p>
        Format:<br><br>
        <strong>benevolent, kind and generous</strong>
    </p>

    <textarea id="bulk-vocab-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
canis, dog
caput, head
corpus, body
dies, day
dominus, master/lord
equus, horse
femina, woman
filius, son
flumen, river
frater, brother
gladius, sword
homo, man/human
ignis, fire
insula, island
luna, moon
    </textarea>

    <button id="start-game-btn">Start Game</button>

</div>

<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">

        <div class="hud-box">BubbleWord</div>

        <div class="hud-box">
            Score: <span id="score">0</span>
        </div>

        <div class="hud-box">
            Level: <span id="level">1</span>
        </div>

        <div class="hud-box">
            Time: <span id="timer">60</span>
        </div>

        <div class="hud-box">
            Attempts: <span id="attempts">20</span>
        </div>

        <!-- ✅ SOUND TOGGLE -->
        <div class="hud-box">
            <button id="mute-btn">🔊</button>
        </div>

    </div>

    <!-- TARGET WORD -->
    <div id="target-word-bar">

        <div id="target-label">
            Find the definition for:
        </div>

        <div id="target-word">
            PRESS START
        </div>

    </div>

</div>

<!-- =========================================
     ✅ LOAD VOCAB FROM URL FIRST
     (THIS MUST COME BEFORE script.js)
========================================= -->

<script>

function loadVocabFromURL() {

    const params = new URLSearchParams(window.location.search);

    if (!params.has("vocab")) return;

    const raw = decodeURIComponent(params.get("vocab"));

    const vocabListFromURL = raw.split(";").map(item => {

        const parts = item.split("|");

        return {
            word: parts[0],
            definition: parts[1]
        };
    });

    // ✅ hide teacher panel for students
    document.getElementById("teacher-panel").style.display = "none";

    // ✅ pass vocab to game
    window.preloadedVocab = vocabListFromURL;
}

loadVocabFromURL();

</script>

<!-- =========================================
     ✅ GAME SCRIPT (LOAD AFTER VOCAB)
========================================= -->

<script src="script.js"></script>

</body>
</html>
