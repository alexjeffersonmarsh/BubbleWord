<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Vocabulary Builder</title>

<link rel="stylesheet" hrefps://cdn.jsdelivr.net/npm/qrcode/build/qrcodept>

<style>
body {
    overflow: auto;
    display: flex;
    justify-content: center;
}

#teacher-panel {
    width: 650px;
    margin-top: 20px;
}

#teacher-input {
    height: 180px;
}

#preview-box table {
    font-size: 13px;
    border-collapse: collapse;
}

#preview-box td, th {
    border: 1px solid #ccc;
    padding: 5px;
}

#result {
    margin-top: 15px;
    background: #f0f9ff;
    padding: 10px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div id="teacher-panel">

<h2>Vocabulary Builder</h2>

<input id="set-name" placeholder="Set Title">

<textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
</textarea>

<button onclick="previewVocab()">Preview</button>
<button onclick="createVocabSet()">Save</button>

<div id="preview-box"></div>
<div id="result"></div>
<canvas id="qrCanvas"></canvas>

</div>

<!-- ✅ ✅ FIREBASE NON-MODULE VERSION -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// ✅ INIT FIREBASE (older version = simpler)
firebase.initializeApp({
  apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
  authDomain: "bubbleword-30367.firebaseapp.com",
  projectId: "bubbleword-30367"
});

const db = firebase.firestore();

// ===== HELPERS =====

function generateID() {
    return Math.random().toString(36).substring(2, 10);
}

function parseCSV(text) {
    return text.split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","))
        .map(line => {
            const parts = line.split(",");
            return {
                word: parts[0].trim(),
                meaning: parts.slice(1).join(",").trim()
            };
        });
}

// ===== PREVIEW =====

function previewVocab() {

    const text = document.getElementById("teacher-input").value;
    const terms = parseCSV(text);

    let html = "<table><tr><th>Word</th><th>Meaning</th></tr>";

    terms.forEach(t => {
        html += `<tr><td>${t.word}</td><td>${t.meaning}</td></tr>`;
    });

    html += "</table>";

    document.getElementById("preview-box").innerHTML = html;
}

// ===== SAVE =====

function createVocabSet() {

    const title = document.getElementById("set-name").value.trim();
    const text = document.getElementById("teacher-input").value;

    if (!title) {
        alert("Enter a title.");
        return;
    }

    const terms = parseCSV(text);

    if (terms.length < 3) {
        alert("Add more vocab.");
        return;
    }

    const id = generateID();

    db.collection("vocabSets").doc(id).set({
        title: title,
        createdAt: Date.now(),
        terms: terms
    })
    .then(() => {

        const link = "https://alexjeffersonmarsh.github.io/BubbleWord/play.html?id=" + id;

        document.getElementById("result").innerHTML = `
            ✅ Saved!<br><br>
            <input id="shareLink" value="${link}" readonly>
            <button onclick="copyLink()">Copy</button>
            <br><br>
            <a href="${link}" target="_.toCanvas(document.getElementById("qrCanvas"), link);
        } catch (e) {}

    })
    .catch(err => {
        console.error(err);
        alert("Save failed");
    });

}

// ===== COPY =====

function copyLink() {
    const input = document.getElementById("shareLink");
    input.select();
    document.execCommand("copy");
    alert("Copied!");
}

</script>

</body>
</html>
``
