<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>BubbleWord Teacher Setup</title>

<!-- ✅ CORRECT CSS LINK -->
<link rel="stylesheet" href="styles.css">

<!-- ✅ CORRECT QR SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

</head>


<body>

<div id="teacher-box">

<h2>BubbleWord Teacher CMS</h2>

<p>Paste vocabulary in format: <b>word, meaning</b></p>

<input id="set-name" placeholder="Set Title (e.g. Unit 1 Vocab)">
<input id="content-area" placeholder="Content Area (Latin, Physics, etc.)">

<!-- ✅ GAME SELECT -->
<h4>Select Game:</h4>
<select id="game-select">
    <option value="index.html">BubbleWord</option>
    <option value="gemword.html">GemWord</option>
    <option value="flashcards.html">Flashcards</option>
</select>

<h4>Paste CSV:</h4>
<textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
</textarea>

<h4>OR Upload CSV File:</h4>
<input type="file" id="csvFile" accept=".csv">

<button class="secondary" onclick="previewVocab()">Preview Vocab</button>

<!-- ✅ BUTTON UPDATED -->
<button onclick="createVocabSet()">Save</button>

<!-- ✅ PREVIEW -->
<div id="preview-box"></div>

<!-- ✅ RESULT -->
<div id="result"></div>
<canvas id="qrCanvas"></canvas>

</div>

<!-- =========================================
     FIREBASE CMS
========================================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ✅ YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
  authDomain: "bubbleword-30367.firebaseapp.com",
  projectId: "bubbleword-30367",
  storageBucket: "bubbleword-30367.firebasestorage.app",
  messagingSenderId: "1058393039019",
  appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =========================================
// HELPERS
// =========================================

function generateID() {
    return Math.random().toString(36).substring(2, 10);
}

function parseCSV(text) {
    const lines = text
        .split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","));

    return lines.map(line => {
        const parts = line.split(",");
        return {
            word: parts[0].trim(),
            meaning: parts.slice(1).join(",").trim()
        };
    });
}

function readCSVFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = err => reject(err);
        reader.readAsText(file);
    });
}

// =========================================
// PREVIEW
// =========================================

window.previewVocab = async function () {

    const pasteText = document.getElementById("teacher-input").value;
    const file = document.getElementById("csvFile").files[0];

    let rawText = file ? await readCSVFile(file) : pasteText;

    if (!rawText.trim()) {
        alert("Paste or upload vocab first.");
        return;
    }

    const terms = parseCSV(rawText);

    let html = `
        <h4>Preview (${terms.length} items)</h4>
        <table>
            <tr>
                <th>Word</th>
                <th>Meaning</th>
            </tr>
    `;

    terms.forEach(t => {
        html += `
            <tr>
                <td>${t.word}</td>
                <td>${t.meaning}</td>
            </tr>
        `;
    });

    html += `</table>`;

    document.getElementById("preview-box").innerHTML = html;
};

// =========================================
// SAVE
// =========================================

window.createVocabSet = async function () {

    const title = document.getElementById("set-name").value.trim();
    const contentArea = document.getElementById("content-area").value.trim();
    const pasteText = document.getElementById("teacher-input").value;
    const file = document.getElementById("csvFile").files[0];

    if (!title) {
        alert("Enter a set title.");
        return;
    }

    let rawText = file ? await readCSVFile(file) : pasteText;

    if (!rawText.trim()) {
        alert("Paste or upload vocabulary.");
        return;
    }

    const terms = parseCSV(rawText);

    if (terms.length < 5) {
        alert("Please include at least 5 vocab items.");
        return;
    }

    const id = generateID();

    await setDoc(doc(db, "vocabSets", id), {
        title,
        contentArea,
        createdAt: Date.now(),
        terms
    });

    // ✅ GAME LINK
    const selectedGame = document.getElementById("game-select").value;
    const link = `${window.location.origin}/${selectedGame}?id=${id}`;

    // ✅ ALWAYS SHOW RESULT (even if QR fails)
    document.getElementById("result").innerHTML = `
        ✅ Saved!<br><br>

        <strong>Game:</strong> ${selectedGame}<br><br>

        <input id="shareLink" value="${link}" readonly>

        <button onclick="copyLink()">Copy Link</button>

        <br><br>
        <strong>Scan QR Code:</strong>
    `;

    // ✅ SAFE QR GENERATION
    try {
        QRCode.toCanvas(document.getElementById("qrCanvas"), link);
    } catch (err) {
        console.warn("QR generation failed:", err);
    }
};

// =========================================
// COPY LINK
// =========================================

window.copyLink = function () {
    const input = document.getElementById("shareLink");
    input.select();
    navigator.clipboard.writeText(input.value);
    alert("✅ Link copied!");
};

</script>

</body>
</html>
