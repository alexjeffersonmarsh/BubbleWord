
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BubbleWord Teacher Setup</title>

    <!-- ✅ Correct CSS link -->
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #9ad9ff, #e6f7ff);
            font-family: Arial, Helvetica, sans-serif;
        }

        #teacher-box {
            width: 600px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
            color: #1d3d57;
        }

        p {
            margin-bottom: 10px;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #b8d7e8;
            font-size: 14px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to bottom, #58d88f, #34bc6e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(to bottom, #69e59d, #2cab63);
        }

        #copy-btn {
            background: linear-gradient(to bottom, #5ec8ff, #37aff2);
        }

        #copy-btn:hover {
            background: linear-gradient(to bottom, #74d1ff, #2ca4e9);
        }

        #link-output {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-all;
            background: #f1faff;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div id="teacher-box">

    <h2>Create Your BubbleWord Game</h2>

    <p>Enter vocabulary (one per line):</p>
    <p><strong>Format:</strong> word, definition</p>

    <textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
canis, dog
caput, head
corpus, body
dies, day
dominus, master/lord
equus, horse
femina, woman
filius, son
flumen, river
frater, brother
gladius, sword
homo, man/human
ignis, fire
insula, island
luna, moon
    </textarea>

    <button onclick="generateLink()">Generate Game Link</button>

    <div id="link-output"></div>

    <button id="copy-btn" style="display:none;" onclick="copyLink()">
        Copy Link
    </button>

</div>

<script>

// =========================================
// GLOBAL LINK STORAGE
// =========================================
let generatedLink = "";

// =========================================
// GENERATE LINK
// =========================================
function generateLink() {

    const input = document.getElementById("teacher-input").value;

    const lines = input.split("\n");

    const encoded = lines
        .filter(line => line.trim() !== "")
        .map(line => {

            const parts = line.split(",");

            if (parts.length < 2) return null;

            const word = parts[0].trim();
            const def = parts.slice(1).join(",").trim();

            return word + "|" + def;
        })
        .filter(x => x !== null)
        .join(";");

    generatedLink =
        window.location.origin +
        "/index.html?vocab=" +
        encodeURIComponent(encoded);

    document.getElementById("link-output").innerHTML =
        "<strong>Share this link:</strong><br><br>" +
        "<a href='" + generatedLink + "' target='_blank'>" +
        generatedLink +
        "</a>";

    document.getElementById("copy-btn").style.display = "block";
}

// =========================================
// COPY LINK
// =========================================
function copyLink() {

    navigator.clipboard.writeText(generatedLink).then(() => {

        const btn = document.getElementById("copy-btn");

        btn.textContent = "Copied! ✅";

        setTimeout(() => {
            btn.textContent = "Copy Link";
        }, 1500);

    }).catch(() => {
        alert("Copy failed. Please copy manually.");
    });
}

</script>

</body>
</html>
