<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>BubbleWord Teacher Setup</title>

<link rel="stylesheet" href="styles.css">

<style>
body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    background: linear-gradient(to bottom, #9ad9ff, #e6f7ff);
    font-family: Arial, Helvetica, sans-serif;
}

#teacher-box {
    width: 700px;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h2 { margin-bottom: 10px; color: #1d3d57; }

p {
    color: #4d6477;
    margin-bottom: 15px;
    line-height: 1.5;
}

textarea, input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #b8d7e8;
    font-size: 14px;
    margin-bottom: 12px;
}

textarea {
    height: 260px;
    resize: none;
    line-height: 1.6;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(to bottom, #58d88f, #34bc6e);
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    transform: translateY(-2px);
}

#result {
    margin-top: 15px;
    font-weight: bold;
    color: #1d3d57;
}

</style>
</head>

<body>

<div id="teacher-box">

<h2>BubbleWord Teacher CMS</h2>

<p>Paste vocabulary in format: <b>word, meaning</b></p>

<input id="set-name" placeholder="Set Title (e.g. Unit 1 Vocab)">
<input id="content-area" placeholder="Content Area (Latin, Physics, etc.)">

<h4>Paste CSV:</h4>
<textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
</textarea>

<h4>OR Upload CSV File:</h4>
<input type="file" id="csvFile" accept=".csv">

<button onclick="createVocabSet()">SAVE</button>

<p id="result"></p>

</div>

<!-- =========================================
     FIREBASE CMS (UPDATED)
========================================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ✅ YOUR CONFIG (already filled in) */
const firebaseConfig = {
  apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
  authDomain: "bubbleword-30367.firebaseapp.com",
  projectId: "bubbleword-30367",
  storageBucket: "bubbleword-30367.firebasestorage.app",
  messagingSenderId: "1058393039019",
  appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =========================================
// HELPERS
// =========================================

function generateID() {
    return Math.random().toString(36).substring(2, 10);
}

function parseCSV(text) {
    const lines = text
        .split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","));

    return lines.map(line => {
        const parts = line.split(",");

        return {
            word: parts[0].trim(),
            meaning: parts.slice(1).join(",").trim()
        };
    });
}

function readCSVFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = err => reject(err);
        reader.readAsText(file);
    });
}

// =========================================
// MAIN SAVE FUNCTION
// =========================================

window.createVocabSet = async function () {

    const title = document.getElementById("set-name").value.trim();
    const contentArea = document.getElementById("content-area").value.trim();
    const pasteText = document.getElementById("teacher-input").value;
    const file = document.getElementById("csvFile").files[0];

    if (!title) {
        alert("Enter a set title.");
        return;
    }

    let rawText = "";

    // ✅ Prefer file if uploaded
    if (file) {
        rawText = await readCSVFile(file);
    } else {
        rawText = pasteText;
    }

    if (!rawText.trim()) {
        alert("Paste or upload vocabulary.");
        return;
    }

    const terms = parseCSV(rawText);

    if (terms.length < 5) {
        alert("Please include at least 5 vocab items.");
        return;
    }

    const id = generateID();

    // ✅ NEW STRUCTURE (matches your requirement)
    await setDoc(doc(db, "vocabSets", id), {
        title: title,
        contentArea: contentArea,
        createdAt: Date.now(),
        terms: terms
    });

    const link = `${window.location.origin}/load.html?id=${id}`;

    document.getElementById("result").innerHTML =
        `✅ Saved! <br><br>
         <a href="${link}" targetlink in any game.`;
};

</script>

</body>
</html>
