<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Vocabulary Builder</title>

<!-- ✅ FIXED CSS -->
<links.css

<!-- ✅ FIXED QR LIB -->
<script src="https://cdn.jsdelivr.net/npm/qrcode.min.js

<style>
body {
    overflow: auto !important;
    justify-content: center !important;
}

#teacher-panel {
    width: 650px;
    max-width: 95vw;
    margin: 20px auto;
}

#teacher-input {
    height: 180px;
}

#preview-box table {
    font-size: 13px;
}

#preview-box td,
#preview-box th {
    padding: 5px;
}

#result {
    margin-top: 15px;
    background: #f0f9ff;
    padding: 10px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div id="teacher-panel">

<h2>Vocabulary Builder</h2>

<p>Paste vocabulary in format: <b>word, meaning</b></p>

<input id="set-name" placeholder="Set Title">
<input id="content-area" placeholder="Content Area">

<textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
</textarea>

<input type="file" id="csvFile" accept=".csv">

<button onclick="previewVocab()">Preview</button>
<button onclick="createVocabSet()">Save</button>

<div id="preview-box"></div>
<div id="result"></div>
<canvas id="qrCanvas"></canvas>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
  authDomain: "bubbleword-30367.firebaseapp.com",
  projectId: "bubbleword-30367"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== HELPERS =====

function generateID() {
    return Math.random().toString(36).substring(2, 10);
}

function parseCSV(text) {
    return text.split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","))
        .map(line => {
            const parts = line.split(",");
            return {
                word: parts[0].trim(),
                meaning: parts.slice(1).join(",").trim()
            };
        });
}

// ===== PREVIEW =====

window.previewVocab = function () {

    const text = document.getElementById("teacher-input").value;
    const terms = parseCSV(text);

    let html = "<table><tr><th>Word</th><th>Meaning</th></tr>";

    terms.forEach(t => {
        html += `<tr><td>${t.word}</td><td>${t.meaning}</td></tr>`;
    });

    html += "</table>";

    document.getElementById("preview-box").innerHTML = html;
};

// ===== SAVE =====

window.createVocabSet = async function () {

    const title = document.getElementById("set-name").value.trim();
    const text = document.getElementById("teacher-input").value;

    if (!title) {
        alert("Enter a title.");
        return;
    }

    const terms = parseCSV(text);

    if (terms.length < 3) {
        alert("Add more vocab.");
        return;
    }

    const id = generateID();

    await setDoc(doc(db, "vocabSets", id), {
        title,
        createdAt: Date.now(),
        terms
    });

    const link = "https://alexjeffersonmarsh.github.io/BubbleWord/play.html?id=" + id;

    document.getElementById("result").innerHTML = `
        ✅ Saved!<br><br>
        <input id="shareLink" value="${link}" readonly>
        <button onclick="copyLink()">Copy</button>
        <br><br>
        <a href▶ Open</a>
    `;

    try {
        QRCode.toCanvas(document.getElementById("qrCanvas"), link);
    } catch (e) {}
};

// ===== COPY =====

window.copyLink = function () {
    const input = document.getElementById("shareLink");
    input.select();
    navigator.clipboard.writeText(input.value);
    alert("Copied!");
};

</script>

</body>
</html>
