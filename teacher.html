
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BubbleWord Teacher Setup</title>

    <!-- ✅ Correct CSS link -->
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background: linear-gradient(to bottom, #9ad9ff, #e6f7ff);
            font-family: Arial, Helvetica, sans-serif;
        }

        #teacher-box {
            width: 650px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
            color: #1d3d57;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #b8d7e8;
            font-size: 14px;
            margin-bottom: 12px;
        }

        textarea {
            height: 260px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to bottom, #58d88f, #34bc6e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(to bottom, #69e59d, #2cab63);
        }

        #copy-btn {
            background: linear-gradient(to bottom, #5ec8ff, #37aff2);
        }

        #saved-sets div {
            margin-top: 10px;
            padding: 10px;
            background: #f1faff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="teacher-box">

    <h2>Create Your BubbleWord Game</h2>

    <input id="set-name" placeholder="Enter set name (e.g. Unit 3 Nouns)">

    <textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
canis, dog
caput, head
corpus, body
dies, day
dominus, master/lord
equus, horse
femina, woman
filius, son
flumen, river
frater, brother
gladius, sword
homo, man/human
ignis, fire
insula, island
luna, moon
    </textarea>

    <button onclick="generateLink()">Generate Game Link</button>

    <div id="link-output"></div>

    <div id="qr-output" style="text-align:center; margin-top:15px;"></div>

    <button id="copy-btn" style="display:none;" onclick="copyLink()">Copy Link</button>

    <h3 style="margin-top:20px;">Saved Sets</h3>
    <div id="saved-sets"></div>

</div>

<script>

let generatedLink = "";

// =========================================
// GENERATE LINK
// =========================================
function generateLink() {

    const name = document.getElementById("set-name").value.trim();
    const input = document.getElementById("teacher-input").value;

    if (!name) {
        alert("Please enter a name for this set.");
        return;
    }

    const lines = input.split("\n");

    const encoded = lines
        .filter(l => l.trim() !== "")
        .map(l => {
            const parts = l.split(",");
            if (parts.length < 2) return null;
            return parts[0].trim() + "|" + parts.slice(1).join(",").trim();
        })
        .filter(x => x !== null)
        .join(";");

    const basePath = window.location.pathname.replace("teacher.html", "");

    generatedLink =
        window.location.origin +
        basePath +
        "?vocab=" +
        encodeURIComponent(encoded);

    document.getElementById("link-output").innerHTML =
        "<strong>Share this link:</strong><br><a href='" + generatedLink +
        "' target='_blank'>" + generatedLink + "</a>";

    document.getElementById("copy-btn").style.display = "block";

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
        encodeURIComponent(generatedLink);

    document.getElementById("qr-output").innerHTML =
        "<p><strong>Scan QR:</strong></p><img src='" + qrURL + "'>";

    saveSet(name, generatedLink, input);
}

// =========================================
// COPY LINK
// =========================================
function copyLink() {

    navigator.clipboard.writeText(generatedLink);

    const btn = document.getElementById("copy-btn");

    btn.textContent = "Copied! ✅";

    setTimeout(() => {
        btn.textContent = "Copy Link";
    }, 1500);
}

// =========================================
// SAVE SETS
// =========================================
function saveSet(name, link, vocab) {

    let sets = JSON.parse(localStorage.getItem("bubbleword_sets")) || [];

    sets = sets.filter(s => s.name !== name);

    sets.unshift({
        name,
        link,
        vocab,
        date: new Date().toLocaleDateString()
    });

    localStorage.setItem("bubbleword_sets", JSON.stringify(sets));

    displaySavedSets();
}

// =========================================
// DISPLAY SAVED SETS
// =========================================
function displaySavedSets() {

    const container = document.getElementById("saved-sets");

    let sets = JSON.parse(localStorage.getItem("bubbleword_sets")) || [];

    if (sets.length === 0) {
        container.innerHTML = "<p>No saved sets yet.</p>";
        return;
    }

    container.innerHTML = sets.map((set, i) => `
        <div>
            <strong>${set.name}</strong> (${set.date})<br>
            <  <span onclick="loadSet(${i})" style="cursor:pointer;">Edit</span> |
            <span onclick="deleteSet(${i})" style="cursor:pointer;color:red;">Delete</span>
        </div>
    `).join("");
}

// =========================================
// LOAD SET
// =========================================
function loadSet(i) {

    const sets = JSON.parse(localStorage.getItem("bubbleword_sets")) || [];

    document.getElementById("set-name").value = sets[i].name;
    document.getElementById("teacher-input").value = sets[i].vocab;
}

// =========================================
// DELETE SET
// =========================================
function deleteSet(i) {

    let sets = JSON.parse(localStorage.getItem("bubbleword_sets")) || [];

    sets.splice(i, 1);

    localStorage.setItem("bubbleword_sets", JSON.stringify(sets));

    displaySavedSets();
}

// =========================================
// INITIAL LOAD
// =========================================
displaySavedSets();

</script>

</body>
</html>
