<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BubbleWord Teacher Setup</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background: linear-gradient(to bottom, #9ad9ff, #e6f7ff);
            font-family: Arial, Helvetica, sans-serif;
        }

        #teacher-box {
            width: 700px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 { margin-bottom: 10px; color: #1d3d57; }

        p {
            color: #4d6477;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #b8d7e8;
            font-size: 14px;
            margin-bottom: 12px;
        }

        textarea {
            height: 320px;
            resize: none;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to bottom, #58d88f, #34bc6e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #saved-sets div {
            margin-top: 10px;
            padding: 12px;
            background: #f1faff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="teacher-box">

    <h2>BubbleWord Teacher CMS</h2>

    <p>Paste vocabulary in format: <b>word, definition</b></p>

    <input id="set-name" placeholder="Enter set name (e.g. sat-unit-1)">

    <textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
canis, dog
caput, head
corpus, body
dies, day
dominus, master/lord
    </textarea>

    <button onclick="createVocabSet()">SAVE TO FIREBASE</button>

    <h3 style="margin-top:25px;">Saved Sets (Local Cache)</h3>
    <div id="saved-sets"></div>

</div>

<!-- =========================================
     FIREBASE AUTO CMS
========================================= -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    doc,
    setDoc,
    collection,
    addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 YOUR FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =========================================
// CREATE SET (AUTO FIREBASE STRUCTURE)
// =========================================

window.createVocabSet = async function () {

    const name = document.getElementById("set-name").value.trim();
    const input = document.getElementById("teacher-input").value;

    if (!name) {
        alert("Enter a set name.");
        return;
    }

    const setId = name.toLowerCase().replace(/\s+/g, "-");

    const lines = input
        .split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","));

    if (lines.length < 5) {
        alert("Add at least 5 vocab entries.");
        return;
    }

    // 1. Create parent set document
    await setDoc(doc(db, "vocabSets", setId), {
        title: name,
        created: new Date().toISOString()
    });

    // 2. Add terms subcollection
    const termsRef = collection(db, "vocabSets", setId, "terms");

    for (let line of lines) {

        const parts = line.split(",");

        await addDoc(termsRef, {
            word: parts[0].trim(),
            definition: parts.slice(1).join(",").trim()
        });
    }

    alert("✅ Saved to Firebase successfully!");
};

</script>

</body>
</html>
