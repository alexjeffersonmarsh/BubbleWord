<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BubbleWord</title>

<!-- CSS -->
<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- =========================================
     TEACHER PANEL
========================================= -->

<div id="teacher-panel">

    <h2>BubbleWord</h2>

    <p>
        Load a vocabulary list from the online repository.
    </p>

    <input
        type="text"
        id="vocab-url"
        placeholder="Paste JSON vocabulary URL here"
    >

    <p style="font-size:13px;color:#666;margin-top:10px;">

        Example:

        <br><br>

        https://alexjeffersonmarsh.github.io/bubble-vocab-lists/sat-unit-1.json

    </p>

    <button id="start-game-btn">
        Start Game
    </button>

</div>

<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <!-- LEFT HUD -->

    <div id="hud-left">

        <div class="hud-box">
            Score:
            <span id="score">0</span>
        </div>

        <div class="hud-box">
            Level:
            <span id="level">1</span>
        </div>

    </div>

    <!-- RIGHT HUD -->

    <div id="hud-right">

        <div class="hud-box">
            Time:
            <span id="timer">60</span>
        </div>

        <div class="hud-box">
            Shots Left:
            <span id="attempts">20</span>
        </div>

        <div class="hud-box">
            <button id="mute-btn">🔊</button>
        </div>

    </div>

    <!-- TARGET WORD -->

    <div id="target-word-bar">

        <div id="target-label">
            Find the definition for:
        </div>

        <div id="target-word">
            PRESS START
        </div>

    </div>

</div>

<!-- =========================================
     VOCABULARY LOADER
========================================= -->

<script>

// =========================================
// GLOBAL PRELOADED VOCAB
// =========================================

window.preloadedVocab = null;

// =========================================
// LOAD VOCABULARY FROM JSON URL
// =========================================

async function loadVocabularyFromURL() {

    const params =
        new URLSearchParams(window.location.search);

    const vocabURL =
        params.get("vocab");

    // No vocab parameter

    if (!vocabURL) {

        return;

    }

    try {

        const response =
            await fetch(vocabURL);

        const data =
            await response.json();

        // Save globally

        window.preloadedVocab = data;

        // Hide teacher panel

        document.getElementById(
            "teacher-panel"
        ).style.display = "none";

        console.log(
            "Vocabulary loaded:",
            data
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not load vocabulary list."
        );

    }

}

// =========================================
// MANUAL URL LOADER
// =========================================

async function loadVocabularyManually() {

    const url =
        document
        .getElementById("vocab-url")
        .value
        .trim();

    if (!url) {

        alert(
            "Please enter a vocabulary URL."
        );

        return;

    }

    try {

        const response =
            await fetch(url);

        const data =
            await response.json();

        window.preloadedVocab = data;

        // Start game

        if (window.startLoadedGame) {

            window.startLoadedGame();

        }

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not load vocabulary list."
        );

    }

}

// =========================================
// BUTTON EVENT
// =========================================

document
    .getElementById("start-game-btn")
    .addEventListener(
        "click",
        loadVocabularyManually
    );

// =========================================
// AUTO LOAD URL PARAMETER
// =========================================

loadVocabularyFromURL();

</script>

<!-- =========================================
     GAME SCRIPT
========================================= -->

<script src="script.js"></script>

</body>
</html>
