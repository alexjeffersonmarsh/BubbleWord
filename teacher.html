
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>BubbleWord Teacher Setup</title>

<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
    overflow: auto;
    display: flex;
    justify-content: center;
}

#teacher-panel {
    width: 650px;
    margin-top: 20px;
}

#teacher-input {
    height: 180px;
}

#preview-box table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

#preview-box th, #preview-box td {
    border: 1px solid #ccc;
    padding: 6px;
}

#result {
    margin-top: 15px;
    background: #f0f9ff;
    padding: 10px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div id="teacher-panel">

<h2>BubbleWord Teacher CMS</h2>

<p>Paste vocabulary in format: <b>word, meaning</b></p>

<input id="set-name" placeholder="Set Title (e.g. Unit 1)">
<input id="content-area" placeholder="Content Area (Latin, etc.)">

<textarea id="teacher-input">
amicus, friend
aqua, water
arbor, tree
bellum, war
caelum, sky
</textarea>

<input type="file" id="csvFile" accept=".csv">

<br><br>

<button onclick="previewVocab()">Preview</button>
<button onclick="createVocabSet()">Save</button>

<div id="preview-box"></div>

<div id="result"></div>
<canvas id="qrCanvas"></canvas>

</div>

<script>

function generateID() {
    return Math.random().toString(36).substring(2, 10);
}

function parseCSV(text) {
    return text.split("\n")
        .map(l => l.trim())
        .filter(l => l.includes(","))
        .map(line => {
            const parts = line.split(",");
            return {
                word: parts[0].trim(),
                meaning: parts.slice(1).join(",").trim()
            };
        });
}

// ===== PREVIEW =====
function previewVocab() {

    const text = document.getElementById("teacher-input").value;
    const terms = parseCSV(text);

    let html = "<h4>Preview</h4><table>";
    html += "<tr><th>Word</th><th>Meaning</th></tr>";

    terms.forEach(t => {
        html += `<tr><td>${t.word}</td><td>${t.meaning}</td></tr>`;
    });

    html += "</table>";

    document.getElementById("preview-box").innerHTML = html;
}

// ===== SAVE =====

async function createVocabSet() {

    const title = document.getElementById("set-name").value.trim();
    const contentArea = document.getElementById("content-area").value.trim();
    const text = document.getElementById("teacher-input").value;

    if (!title) {
        alert("Enter a title.");
        return;
    }

    const terms = parseCSV(text);

    if (terms.length < 5) {
        alert("Add at least 5 vocab items.");
        return;
    }

    const id = generateID();

    try {

        const response = await fetch(
            "https://firestore.googleapis.com/v1/projects/bubbleword-30367/databases/(default)/documents/vocabSets?documentId=" + id,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fields: {
                        title: { stringValue: title },
                        contentArea: { stringValue: contentArea },
                        createdAt: { integerValue: Date.now().toString() },
                        terms: {
                            stringValue: JSON.stringify(terms)
                        }
                    }
                })
            }
        );

        // ✅ ORIGINAL WORKING LINK
        const link = "https://alexjeffersonmarsh.github.io/BubbleWord/index.html?id=" + id;

        document.getElementById("result").innerHTML = `
            ✅ Saved!<br><br>
            <input id="shareLink" value="${link}" readonly>
            <     <br><br>
            ${link}<strong>▶ Open Game</strong></a>
            <br><br>
            Scan QR Code:
        `;

        QRCode.toCanvas(document.getElementById("qrCanvas"), link);

    } catch (err) {

        console.error(err);
        alert("Save failed.");

    }
}

// ===== COPY =====

function copyLink() {
    const input = document.getElementById("shareLink");
    input.select();
    document.execCommand("copy");
    alert("Copied!");
}

</script>

</body>
</html>
